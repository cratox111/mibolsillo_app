version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: mibolsillo_db
    environment:
      POSTGRES_USER: diego2011
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: mibolsillo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diego2011 -d mibolsillo"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: mibolsillo_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://diego2011:123456@db:5432/mibolsillo
      APP_ENV: development
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
